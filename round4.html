<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Раунд 4 — Угадай по описанию</title>
<style>
    body { margin:0; padding:0; background:#e8f5e9; font-family:Arial; }
    .header { width:100%; background:#1b5e20; color:white; padding:20px 0;
        font-size:34px; text-align:center; font-weight:bold; }

    h1 { text-align:center; margin-top:20px; }

    .teams-container { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin:20px 0; }
    .team-round {
        width:160px; height:160px; background:white; border-radius:15px;
        display:flex; flex-direction:column; justify-content:center; align-items:center;
        box-shadow:0 0 10px rgba(0,0,0,0.2); font-size:18px; font-weight:bold;
    }
    .score { font-size:30px; margin:10px 0; }

    .question-block {
        background:white; width:80%; margin:15px auto; padding:20px;
        border-radius:15px; font-size:22px; text-align:center; cursor:pointer;
        box-shadow:0 0 10px rgba(0,0,0,0.2); transition:0.2s;
    }
    .question-block:hover { transform:scale(1.02); background:#dcedc8; }

    .disabled { background:#bdbdbd !important; color:#555 !important; pointer-events:none; }

    #modal {
        position:fixed; left:0; top:0; width:100%; height:100%;
        background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center;
    }
    #modal-content {
        background:white; padding:25px; width:600px; border-radius:15px; text-align:center;
    }

    #answer { display:none; font-size:24px; margin-top:20px; color:#1b5e20; font-weight:bold; }

    .btn { padding:6px 14px; font-size:18px; margin:3px; border:none;
        background:#43a047; color:white; border-radius:6px; cursor:pointer; }
    .btn.minus { background:#c62828; }
</style>
</head>
<body>

<div class="header">Раунд 4 — Угадай по описанию</div>

<div id="game-area">
     <div class="teams-container" id="teams-score"></div>
    <div id="questions-container"></div>
</div>

<!-- МОДАЛКА -->
<div id="modal">
    <div id="modal-content">
        <h2 id="question-text"></h2>

        <button class="btn" onclick="showAnswer()">Показать ответ</button>
        <div id="answer"></div>

        <br><br>
        <label style="font-size:18px;">Выберите команду:</label><br>
        <select id="team-select" style="font-size:18px; margin:10px;"></select><br>

        <button class="btn" onclick="addPoint()">+1 балл</button>
        <button class="btn minus" onclick="subPoint()">-1 балл</button>

        <br><br>
        <button class="btn" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<script>
/* ========= Команды из localStorage ========= */
let teams = [];
for(let i=1;i<=5;i++){
    teams.push({name: localStorage.getItem("team"+i) || ("Команда "+i), score:0});
}

/* ========= Вопросы ========= */
const questions = [
    ["Вещество в сигаретах, вызывает зависимость и сужает сосуды.","Никотин"],
    ["Напиток, дающий краткий прилив энергии, но затем вызывающий упадок сил.","Энергетик"],
    ["Орган, который первым страдает от алкоголя и почти не восстанавливается.","Печень"],
    ["Состояние дрожи и раздражительности при отказе от привычного стимула.","Синдром отмены"],
    ["Привычка, ухудшающая цвет лица, вызывающая кашель и снижает выносливость.","Курение"],
    ["Состояние слабости, головной боли и сухости во рту из-за нехватки воды.","Обезвоживание"],
    ["Вещество, повышающее сахар в крови и вызывающее зависимость.","Сахар"],
    ["Орган, нуждающийся в 7–9 часах отдыха для памяти и внимания.","Головной мозг"],
    ["Привычка, усиливающая стресс и ухудшающая сон.","Алкоголь"],
    ["Процесс ночного восстановления организма, влияющий на иммунитет.","Сон"]
];

let answered = Array(questions.length).fill(false);
let currentQ = null;

/* ========= Отрисовка ========= */
function renderTeams(){
    let c=document.getElementById("teams-score");
    c.innerHTML="";
    teams.forEach((t,i)=>{
        c.innerHTML += `
            <div class="team-round">
                ${t.name}
                <div class="score" id="s${i}">${t.score}</div>
            </div>`;
    });
}

function renderQuestions(){
    let c=document.getElementById("questions-container");
    c.innerHTML="";
    questions.forEach((q,i)=>{
        let div=document.createElement("div");
        div.className="question-block";
        div.innerText="Описание №"+(i+1);
        if(answered[i]){
            div.classList.add("disabled");
        } else {
            div.onclick = ()=> openModal(i);
        }
        c.appendChild(div);
    });
}

/* ========= Модалка ========= */
function fillTeamSelect(){
    let sel=document.getElementById("team-select");
    sel.innerHTML="";
    teams.forEach((t,i)=>{
        let opt=document.createElement("option");
        opt.value=i; opt.textContent=t.name;
        sel.appendChild(opt);
    });
}

function openModal(i){
    currentQ = i;
    document.getElementById("question-text").innerText = questions[i][0];
    document.getElementById("answer").style.display="none";
    document.getElementById("answer").innerText = "Ответ: " + questions[i][1];

    document.getElementById("modal").style.display="flex";
    fillTeamSelect();
}

function showAnswer(){
    document.getElementById("answer").style.display="block";
}

/* ========= Начисление баллов ========= */
function addPoint(){
    let idx = parseInt(document.getElementById("team-select").value);
    teams[idx].score++;
    document.getElementById("s"+idx).innerText = teams[idx].score;
}
function subPoint(){
    let idx = parseInt(document.getElementById("team-select").value);
    teams[idx].score--;
    document.getElementById("s"+idx).innerText = teams[idx].score;
}

/* ========= Закрытие модалки ========= */
function closeModal(){
    document.getElementById("modal").style.display="none";
    answered[currentQ] = true;
    renderQuestions();
}

/* ========= Инициализация ========= */
renderTeams();
renderQuestions();
</script>

</body>
</html>
